name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build with Vite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Debug Check if dist exists
        run: |
          if [ -d dist ]; then
            echo "✅ dist directory found:"
            ls -R dist
          else
            echo "❌ dist directory NOT found."
            exit 1
          fi

      - name: Upload production build artifacts
        uses: actions/upload-artifact@9c3aeb48a8d9c1dd0c479264f595e75f6e9f9e43
        with:
          name: production-files
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download artifact
        uses: actions/download-artifact@fc57f57e1c82f377b66184e95e2c8a9e4ff4a9f2
        with:
          name: production-files
          path: dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
